services:
  - type: web
    name: 81-maktab
    env: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_LIFETIME
        value: "120"
      - key: CACHE_DRIVER
        value: database
      - key: FILESYSTEM_DISK
        value: public
      - key: APP_KEY
        generateValue: true
      # Quyidagilarni Render.com dashboard da qo'lda kiriting:
      # GROQ_API_KEY, DB_HOST, DB_DATABASE, DB_USERNAME, DB_PASSWORD, APP_URL
